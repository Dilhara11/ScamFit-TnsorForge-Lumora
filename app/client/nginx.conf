# Hashed build assets are immutable; the app shell must always revalidate.
# Set via map so no location-level add_header discards the security headers.
map $uri $svo_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Matches the API's 64 KiB request limit.
    client_max_body_size 64k;

    add_header Cache-Control $svo_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /health/ {
        proxy_pass http://api:8000;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Client-side routes fall back to the app shell.
    location / {
        try_files $uri /index.html;
    }
}
