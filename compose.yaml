services:
  api:
    image: svo-api:local
    build:
      context: .
      dockerfile: app/server/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SVO_MODE: ${SVO_MODE:-local_demo}
      SVO_CREDENTIALS_JSON: ${SVO_CREDENTIALS_JSON:-{}}
      SVO_ALLOWED_ORIGINS: ${SVO_ALLOWED_ORIGINS:-}
      SVO_QUEUE_CAPACITY: ${SVO_QUEUE_CAPACITY:-32}
    volumes:
      - svo-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    cpus: 2
    mem_limit: 2g
    restart: unless-stopped
    stop_grace_period: 35s
  client:
    image: svo-client:local
    profiles: ["frontend"]
    build:
      context: app/client
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  svo-data:
